<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Privasi</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Status Koneksi -->
    <div class="status-indicator">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">Menyambung...</span>
    </div>

    <!-- Layar Pemilihan Room -->
    <div class="screen-selector active" id="screenSelector">
        <div class="selector-container">
            <div class="logo">
                <i class="fas fa-comments"></i>
                <h1>Chat Privasi</h1>
                <p class="tagline">100% Anonim • 15 Menit Sesi</p>
            </div>
            
            <div class="selection-area">
                <div class="selection-group">
                    <div class="selection-label">
                        <i class="fas fa-folder"></i>
                        <span>KATEGORI</span>
                    </div>
                    <div class="selection-display">
                        <button class="nav-btn" id="prevCategory">
                            <i class="fas fa-chevron-left"></i>
                        </button>
                        <div class="selection-value" id="categoryValue">A</div>
                        <button class="nav-btn" id="nextCategory">
                            <i class="fas fa-chevron-right"></i>
                        </button>
                    </div>
                </div>
                
                <div class="selection-group">
                    <div class="selection-label">
                        <i class="fas fa-door-closed"></i>
                        <span>ROOM</span>
                    </div>
                    <div class="selection-display">
                        <button class="nav-btn" id="prevRoom">
                            <i class="fas fa-chevron-left"></i>
                        </button>
                        <div class="selection-value" id="roomValue">001</div>
                        <button class="nav-btn" id="nextRoom">
                            <i class="fas fa-chevron-right"></i>
                        </button>
                    </div>
                </div>
                
                <button class="enter-btn" id="enterBtn">
                    <i class="fas fa-sign-in-alt"></i>
                    MASUK CHAT
                </button>
                
                <div class="info-box">
                    <i class="fas fa-info-circle"></i>
                    <p>Percakapan akan otomatis terhapus setelah 15 menit. Tidak ada riwayat yang disimpan.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Layar Chat -->
    <div class="chat-screen" id="chatScreen">
        <div class="chat-header">
            <div class="header-left">
                <button class="back-btn" id="backBtn">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <div class="room-info">
                    <div class="room-title" id="roomTitle">Room A-001</div>
                    <div class="room-stats" id="roomStats">0 pengguna online</div>
                </div>
            </div>
            <div class="header-right">
                <div class="session-timer" id="sessionTimer">15:00</div>
                <div class="user-id-display" id="userIdDisplay">Anonim</div>
            </div>
        </div>
        
        <div class="messages-container" id="messagesContainer">
            <!-- Pesan akan dimasukkan di sini secara dinamis -->
            <div class="welcome-message">
                <div class="message system">
                    <div class="message-content">
                        <i class="fas fa-shield-alt"></i>
                        Selamat datang di Chat Privasi. Percakapan Anda aman dan anonim.
                    </div>
                </div>
            </div>
        </div>
        
        <div class="input-area">
            <div class="input-tools">
                <button class="tool-btn" id="mediaBtn" title="Unggah Gambar">
                    <i class="fas fa-image"></i>
                </button>
                <button class="tool-btn" id="replyBtn" title="Balas Pesan">
                    <i class="fas fa-reply"></i>
                </button>
                <input type="file" id="fileInput" accept="image/*" style="display: none;">
            </div>
            <div class="message-input-wrapper">
                <input type="text" class="message-input" id="messageInput" placeholder="Ketik pesan...">
                <div class="reply-preview" id="replyPreview">
                    <span class="reply-text"></span>
                    <button class="cancel-reply" id="cancelReply">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>
            <button class="send-btn" id="sendBtn">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <!-- Modal untuk gambar -->
    <div class="modal" id="imageModal">
        <div class="modal-content">
            <button class="modal-close" id="modalClose">
                <i class="fas fa-times"></i>
            </button>
            <img id="modalImage" src="" alt="Gambar">
            <div class="modal-actions">
                <button class="modal-btn" id="downloadBtn">
                    <i class="fas fa-download"></i> Unduh
                </button>
                <button class="modal-btn" id="closeModalBtn">
                    <i class="fas fa-times"></i> Tutup
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
