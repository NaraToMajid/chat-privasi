<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Privasi 100%</title>
    <style>
        /* RESET & BASE */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #000; 
            color: #0f0; 
            font-family: 'Courier New', monospace;
            height: 100vh;
            overflow: hidden;
        }
        
        /* APP CONTAINER */
        #app {
            max-width: 600px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 10px;
        }
        
        /* SELECTOR SCREEN */
        .selector-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }
        
        .title {
            color: #0f0;
            font-size: 22px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 20px;
        }
        
        .selector-group {
            text-align: center;
            width: 100%;
        }
        
        .selector-label {
            color: #666;
            font-size: 12px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .selector-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 15px 0;
        }
        
        .selector-value {
            font-size: 48px;
            color: #0f0;
            font-weight: bold;
            min-width: 100px;
            text-align: center;
        }
        
        .nav-btn {
            background: #111;
            border: 2px solid #0f0;
            color: #0f0;
            width: 50px;
            height: 50px;
            font-size: 24px;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.2s;
        }
        
        .nav-btn:hover {
            background: #222;
        }
        
        .nav-btn:active {
            background: #333;
        }
        
        .enter-btn {
            background: transparent;
            border: 2px solid #0f0;
            color: #0f0;
            padding: 15px 50px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 30px;
            border-radius: 5px;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .enter-btn:hover {
            background: #0f0;
            color: #000;
        }
        
        /* CHAT SCREEN */
        .chat-screen {
            flex: 1;
            display: none;
            flex-direction: column;
        }
        
        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #222;
            margin-bottom: 10px;
        }
        
        .room-info {
            flex: 1;
        }
        
        .room-title {
            color: #0f0;
            font-size: 18px;
            margin-bottom: 5px;
        }
        
        .room-stats {
            color: #666;
            font-size: 12px;
            display: flex;
            gap: 15px;
        }
        
        .back-btn {
            background: #111;
            border: 1px solid #0f0;
            color: #0f0;
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 3px;
            font-size: 12px;
        }
        
        .back-btn:hover {
            background: #222;
        }
        
        /* MESSAGES */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            border: 1px solid #222;
            margin: 10px 0;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .message {
            padding: 10px 15px;
            border-radius: 8px;
            max-width: 85%;
            word-wrap: break-word;
        }
        
        .message.system {
            background: #111;
            color: #666;
            align-self: center;
            font-size: 11px;
            text-align: center;
            max-width: 90%;
        }
        
        .message.received {
            background: #111;
            color: #ccc;
            align-self: flex-start;
            border-left: 3px solid #0f0;
        }
        
        .message.sent {
            background: #0a2a0a;
            color: #0f0;
            align-self: flex-end;
            border-right: 3px solid #0f0;
        }
        
        .message-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 11px;
        }
        
        .message-user {
            color: #0af;
            font-weight: bold;
        }
        
        .message-time {
            color: #666;
        }
        
        .message-content {
            line-height: 1.4;
        }
        
        .message-media {
            max-width: 100%;
            max-height: 200px;
            margin-top: 8px;
            border-radius: 5px;
            border: 1px solid #333;
        }
        
        /* INPUT AREA */
        .input-area {
            display: flex;
            gap: 10px;
            padding: 10px 0;
        }
        
        .message-input {
            flex: 1;
            background: #111;
            border: 1px solid #333;
            color: #0f0;
            padding: 12px 15px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            border-radius: 5px;
            outline: none;
        }
        
        .message-input:focus {
            border-color: #0f0;
        }
        
        .send-btn {
            background: #000;
            border: 2px solid #0f0;
            color: #0f0;
            padding: 0 25px;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
            transition: all 0.2s;
        }
        
        .send-btn:hover {
            background: #0f0;
            color: #000;
        }
        
        /* STATUS INDICATOR */
        .status-indicator {
            position: fixed;
            bottom: 15px;
            right: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.8);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 12px;
            border: 1px solid #333;
        }
        
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #f00;
            animation: pulse 2s infinite;
        }
        
        .status-dot.connected {
            background: #0f0;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        /* SCROLLBAR */
        ::-webkit-scrollbar {
            width: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: #111;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 3px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #444;
        }
        
        /* RESPONSIVE */
        @media (max-width: 600px) {
            #app {
                padding: 5px;
            }
            
            .selector-value {
                font-size: 36px;
                min-width: 80px;
            }
            
            .nav-btn {
                width: 40px;
                height: 40px;
                font-size: 20px;
            }
            
            .room-stats {
                flex-direction: column;
                gap: 3px;
            }
            
            .input-area {
                flex-direction: column;
            }
            
            .send-btn {
                padding: 12px;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- SELECTOR SCREEN -->
        <div class="selector-screen" id="selectorScreen">
            <div class="title">CHAT PRIVASI 100%</div>
            
            <div class="selector-group">
                <div class="selector-label">KATEGORI A-Z</div>
                <div class="selector-controls">
                    <button class="nav-btn" id="prevCatBtn">←</button>
                    <div class="selector-value" id="catValue">A</div>
                    <button class="nav-btn" id="nextCatBtn">→</button>
                </div>
            </div>
            
            <div class="selector-group">
                <div class="selector-label">ROOM 1-100</div>
                <div class="selector-controls">
                    <button class="nav-btn" id="prevRoomBtn">←</button>
                    <div class="selector-value" id="roomValue">001</div>
                    <button class="nav-btn" id="nextRoomBtn">→</button>
                </div>
            </div>
            
            <button class="enter-btn" id="enterBtn">MASUK KE CHAT</button>
        </div>
        
        <!-- CHAT SCREEN -->
        <div class="chat-screen" id="chatScreen">
            <div class="chat-header">
                <div class="room-info">
                    <div class="room-title" id="roomTitle">Pilih Room</div>
                    <div class="room-stats">
                        <span id="userCount">0 pengguna</span>
                        <span id="timerDisplay">15:00</span>
                    </div>
                </div>
                <button class="back-btn" id="backBtn">KELUAR</button>
            </div>
            
            <div class="messages-container" id="messagesContainer">
                <!-- Messages will appear here -->
            </div>
            
            <div class="input-area">
                <input type="text" class="message-input" id="messageInput" 
                       placeholder="Ketik pesan... (Enter untuk kirim)" autocomplete="off">
                <button class="send-btn" id="sendBtn">KIRIM</button>
            </div>
        </div>
    </div>
    
    <!-- STATUS INDICATOR -->
    <div class="status-indicator">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">Menghubungkan...</span>
    </div>
    
    <!-- HIDDEN FILE INPUT -->
    <input type="file" id="fileInput" accept="image/*,video/*" style="display: none;">
    
    <script>
        class ChatApp {
            constructor() {
                this.ws = null;
                this.userId = '';
                this.currentCat = 'A';
                this.currentRoom = 1;
                this.sessionTimer = null;
                this.timeLeft = 900; // 15 menit
                this.keepAliveInterval = null;
                
                this.init();
            }
            
            init() {
                this.cacheElements();
                this.bindEvents();
                this.updateSelector();
                this.connectWebSocket();
            }
            
            cacheElements() {
                this.selectorScreen = document.getElementById('selectorScreen');
                this.chatScreen = document.getElementById('chatScreen');
                this.catValue = document.getElementById('catValue');
                this.roomValue = document.getElementById('roomValue');
                this.roomTitle = document.getElementById('roomTitle');
                this.userCount = document.getElementById('userCount');
                this.timerDisplay = document.getElementById('timerDisplay');
                this.messagesContainer = document.getElementById('messagesContainer');
                this.messageInput = document.getElementById('messageInput');
                this.statusDot = document.getElementById('statusDot');
                this.statusText = document.getElementById('statusText');
            }
            
            bindEvents() {
                // Navigation
                document.getElementById('prevCatBtn').onclick = () => this.navigateCat(-1);
                document.getElementById('nextCatBtn').onclick = () => this.navigateCat(1);
                document.getElementById('prevRoomBtn').onclick = () => this.navigateRoom(-1);
                document.getElementById('nextRoomBtn').onclick = () => this.navigateRoom(1);
                document.getElementById('enterBtn').onclick = () => this.enterRoom();
                document.getElementById('backBtn').onclick = () => this.leaveRoom();
                
                // Chat
                document.getElementById('sendBtn').onclick = () => this.sendMessage();
                this.messageInput.onkeypress = (e) => {
                    if (e.key === 'Enter') this.sendMessage();
                };
                
                // Media upload
                document.getElementById('fileInput').onchange = (e) => this.handleFileUpload(e);
                
                // Keep app alive
                document.addEventListener('click', () => this.resetInactivityTimer());
                document.addEventListener('keypress', () => this.resetInactivityTimer());
            }
            
            navigateCat(direction) {
                const cats = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
                let index = cats.indexOf(this.currentCat) + direction;
                if (index < 0) index = 25;
                if (index > 25) index = 0;
                this.currentCat = cats[index];
                this.updateSelector();
            }
            
            navigateRoom(direction) {
                this.currentRoom += direction;
                if (this.currentRoom < 1) this.currentRoom = 100;
                if (this.currentRoom > 100) this.currentRoom = 1;
                this.updateSelector();
            }
            
            updateSelector() {
                this.catValue.textContent = this.currentCat;
                this.roomValue.textContent = this.currentRoom.toString().padStart(3, '0');
            }
            
            connectWebSocket() {
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const wsUrl = `${protocol}//${window.location.host}`;
                
                console.log('Connecting to:', wsUrl);
                this.ws = new WebSocket(wsUrl);
                
                this.ws.onopen = () => {
                    console.log('✅ WebSocket connected');
                    this.updateStatus(true, 'Terhubung');
                    
                    // Keep-alive ping
                    this.keepAliveInterval = setInterval(() => {
                        if (this.ws.readyState === WebSocket.OPEN) {
                            this.ws.send(JSON.stringify({ type: 'ping' }));
                        }
                    }, 25000);
                };
                
                this.ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        this.handleMessage(data);
                    } catch (error) {
                        console.error('Error parsing message:', error);
                    }
                };
                
                this.ws.onclose = () => {
                    console.log('❌ WebSocket disconnected');
                    this.updateStatus(false, 'Terputus - Menghubungkan ulang...');
                    
                    if (this.keepAliveInterval) {
                        clearInterval(this.keepAliveInterval);
                    }
                    
                    // Reconnect setelah 3 detik
                    setTimeout(() => this.connectWebSocket(), 3000);
                };
                
                this.ws.onerror = (error) => {
                    console.error('WebSocket error:', error);
                    this.updateStatus(false, 'Error koneksi');
                };
            }
            
            updateStatus(connected, text) {
                this.statusDot.className = 'status-dot' + (connected ? ' connected' : '');
                this.statusText.textContent = text;
            }
            
            handleMessage(data) {
                switch(data.type) {
                    case 'init':
                        this.userId = data.userId;
                        break;
                        
                    case 'joined':
                        this.roomTitle.textContent = `Room ${data.roomId}`;
                        this.userCount.textContent = `${data.userCount} pengguna online`;
                        this.startSessionTimer();
                        break;
                        
                    case 'system':
                        this.addMessage({
                            type: 'system',
                            text: data.message,
                            timestamp: data.timestamp
                        });
                        if (data.userCount !== undefined) {
                            this.userCount.textContent = `${data.userCount} pengguna online`;
                        }
                        break;
                        
                    case 'message':
                        this.addMessage({
                            type: data.userId === this.userId ? 'sent' : 'received',
                            userId: data.userId,
                            text: data.text,
                            timestamp: data.timestamp
                        });
                        break;
                        
                    case 'media':
                        this.addMessage({
                            type: data.userId === this.userId ? 'sent' : 'received',
                            userId: data.userId,
                            mediaType: data.mediaType,
                            data: data.data,
                            timestamp: data.timestamp
                        });
                        break;
                        
                    case 'timeout':
                        this.leaveRoom();
                        alert('⏰ Sesi 15 menit telah berakhir. Silakan masuk kembali.');
                        break;
                }
            }
            
            addMessage(msg) {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${msg.type}`;
                
                const time = new Date(msg.timestamp || Date.now());
                const timeStr = `${time.getHours().toString().padStart(2, '0')}:${time.getMinutes().toString().padStart(2, '0')}`;
                
                let content = '';
                
                if (msg.type === 'system') {
                    content = `
                        <div class="message-content">${msg.text}</div>
                    `;
                } else {
                    const displayName = msg.userId === this.userId ? 'Anda' : msg.userId;
                    
                    content = `
                        <div class="message-header">
                            <span class="message-user">${displayName}</span>
                            <span class="message-time">${timeStr}</span>
                        </div>
                        <div class="message-content">
                            ${msg.text || ''}
                            ${msg.mediaType === 'image' ? 
                                `<img src="${msg.data}" class="message-media" alt="Gambar">` : ''}
                            ${msg.mediaType === 'video' ? 
                                `<video controls class="message-media"><source src="${msg.data}" type="video/mp4"></video>` : ''}
                        </div>
                    `;
                }
                
                messageDiv.innerHTML = content;
                this.messagesContainer.appendChild(messageDiv);
                this.messagesContainer.scrollTop = this.messagesContainer.scrollHeight;
            }
            
            startSessionTimer() {
                this.timeLeft = 900; // Reset ke 15 menit
                
                if (this.sessionTimer) {
                    clearInterval(this.sessionTimer);
                }
                
                this.sessionTimer = setInterval(() => {
                    this.timeLeft--;
                    
                    const minutes = Math.floor(this.timeLeft / 60);
                    const seconds = this.timeLeft % 60;
                    this.timerDisplay.textContent = 
                        `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                    
                    if (this.timeLeft <= 0) {
                        this.leaveRoom();
                    }
                }, 1000);
            }
            
            resetInactivityTimer() {
                // Reset timer setiap ada aktivitas pengguna
                if (this.timeLeft < 300) { // Jika kurang dari 5 menit
                    this.timeLeft = 900; // Reset ke 15 menit
                }
            }
            
            enterRoom() {
                if (!this.ws || this.ws.readyState !== WebSocket.OPEN) {
                    alert('Tunggu koneksi ke server...');
                    return;
                }
                
                const roomId = `${this.currentCat}-${this.currentRoom.toString().padStart(3, '0')}`;
                
                this.ws.send(JSON.stringify({
                    type: 'join',
                    category: this.currentCat,
                    room: this.currentRoom
                }));
                
                // Switch screen
                this.selectorScreen.style.display = 'none';
                this.chatScreen.style.display = 'flex';
                this.messagesContainer.innerHTML = '';
                this.messageInput.focus();
                
                // Add welcome message
                this.addMessage({
                    type: 'system',
                    text: `🌐 Anda memasuki ${roomId}`,
                    timestamp: Date.now()
                });
            }
            
            leaveRoom() {
                // Switch screen
                this.chatScreen.style.display = 'none';
                this.selectorScreen.style.display = 'flex';
                
                // Clear timer
                if (this.sessionTimer) {
                    clearInterval(this.sessionTimer);
                    this.sessionTimer = null;
                }
                
                // Clear messages
                this.messagesContainer.innerHTML = '';
                this.messageInput.value = '';
                
                this.timerDisplay.textContent = '15:00';
            }
            
            sendMessage() {
                const text = this.messageInput.value.trim();
                if (!text) return;
                
                if (!this.ws || this.ws.readyState !== WebSocket.OPEN) {
                    alert('Tidak terhubung ke server');
                    return;
                }
                
                this.ws.send(JSON.stringify({
                    type: 'message',
                    text: text
                }));
                
                this.messageInput.value = '';
                this.messageInput.focus();
            }
            
            handleFileUpload(event) {
                const file = event.target.files[0];
                if (!file) return;
                
                // Max 5MB
                if (file.size > 5 * 1024 * 1024) {
                    alert('Ukuran file maksimal 5MB');
                    return;
                }
                
                const isImage = file.type.startsWith('image/');
                const isVideo = file.type.startsWith('video/');
                
                if (!isImage && !isVideo) {
                    alert('Hanya gambar dan video yang didukung');
                    return;
                }
                
                const reader = new FileReader();
                
                reader.onload = (e) => {
                    if (!this.ws || this.ws.readyState !== WebSocket.OPEN) {
                        alert('Tidak terhubung ke server');
                        return;
                    }
                    
                    this.ws.send(JSON.stringify({
                        type: 'media',
                        mediaType: isImage ? 'image' : 'video',
                        data: e.target.result
                    }));
                };
                
                reader.readAsDataURL(file);
                event.target.value = '';
            }
        }
        
        // Start app ketika halaman load
        document.addEventListener('DOMContentLoaded', () => {
            window.chatApp = new ChatApp();
        });
    </script>
</body>
</html>
