<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Privasi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Selector Screen -->
        <div class="selector active" id="selector">
            <div class="selector-content">
                <div class="logo-section">
                    <div class="logo">🔒</div>
                    <h1>ORAPRIVCHAT</h1>
                    <p class="tagline">Aman • Cepat • Anonim</p>
                </div>
                
                <div class="selection-area">
                    <div class="selection-card">
                        <div class="selection-header">
                            <span class="selection-icon">📂</span>
                            <span class="selection-title">KATEGORI</span>
                        </div>
                        <div class="selection-controls">
                            <button class="control-btn prev" id="prevCat">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M15 18l-6-6 6-6"/>
                                </svg>
                            </button>
                            <div class="selection-display">
                                <div class="selection-value" id="catValue">A</div>
                                <div class="selection-label">Kategori</div>
                            </div>
                            <button class="control-btn next" id="nextCat">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M9 18l6-6-6-6"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    
                    <div class="selection-card">
                        <div class="selection-header">
                            <span class="selection-icon">🚪</span>
                            <span class="selection-title">ROOM</span>
                        </div>
                        <div class="selection-controls">
                            <button class="control-btn prev" id="prevRoom">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M15 18l-6-6 6-6"/>
                                </svg>
                            </button>
                            <div class="selection-display">
                                <div class="selection-value" id="roomValue">001</div>
                                <div class="selection-label">Room Number</div>
                            </div>
                            <button class="control-btn next" id="nextRoom">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M9 18l6-6-6-6"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    
                    <div class="room-preview">
                        <div class="preview-badge">
                            <span class="preview-icon">📍</span>
                            <span class="preview-text">ROOM <span id="roomDisplay">A-001</span></span>
                        </div>
                        <p class="preview-info">Sesi 15 menit • Auto-delete • Enkripsi end-to-end</p>
                    </div>
                </div>
                
                <button class="primary-btn enter-btn" id="enterBtn">
                    <span>MASUK KE CHAT</span>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M5 12h14M12 5l7 7-7 7"/>
                    </svg>
                </button>
            </div>
        </div>
        
        <!-- Chat Screen -->
        <div class="chat" id="chat">
            <div class="chat-header">
                <button class="back-btn" id="backBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                </button>
                
                <div class="room-info">
                    <div class="room-title" id="roomTitle">Room A-001</div>
                    <div class="room-stats">
                        <span class="user-count" id="userCount">1 user</span>
                        <span class="status-dot"></span>
                    </div>
                </div>
                
                <div class="timer-container">
                    <div class="timer-icon">⏱️</div>
                    <div class="timer" id="timer">15:00</div>
                </div>
            </div>
            
            <div class="messages-container" id="messages">
                <div class="welcome-message">
                    <div class="welcome-icon">👋</div>
                    <div class="welcome-text">
                        <h3>Selamat Datang!</h3>
                        <p>Semua pesan akan terhapus otomatis setelah 15 menit</p>
                    </div>
                </div>
            </div>
            
            <div class="input-container">
                <div class="input-tools">
                    <button class="tool-btn" id="attachBtn" title="Lampirkan file (max 5MB)">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>
                        </svg>
                    </button>
                    <input type="file" id="fileInput" accept="image/*,video/*" style="display: none;">
                </div>
                
                <input type="text" 
                       class="message-input" 
                       id="messageInput" 
                       placeholder="Ketik pesan..."
                       autocomplete="off">
                
                <button class="send-btn" id="sendBtn" title="Kirim (Enter)">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                    </svg>
                </button>
            </div>
            
            <div class="upload-progress" id="uploadProgress" style="display: none;">
                <div class="progress-bar">
                    <div class="progress-fill"></div>
                </div>
                <span class="progress-text">Mengunggah...</span>
                <button class="cancel-btn" id="cancelUpload">✕</button>
            </div>
        </div>
    </div>
    
    <!-- Status Indicator -->
    <div class="status-indicator" id="statusIndicator">
        <div class="status-content">
            <span class="status-icon" id="statusIcon">●</span>
            <span class="status-text" id="statusText">Menghubungkan...</span>
        </div>
    </div>
    
    <!-- Notifikasi -->
    <div class="notification" id="notification"></div>
    
    <script src="script.js"></script>
</body>
</html>
