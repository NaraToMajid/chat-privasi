<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Privasi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Selector Screen -->
        <div class="selector" id="selector">
            <div class="selector-header">
                <h1>CHAT PRIVASI 100%</h1>
                <p class="subtitle">Pilih Room Untuk Memulai</p>
            </div>
            
            <div class="selector-content">
                <div class="selection-group">
                    <div class="selection-label">KATEGORI</div>
                    <div class="selection-controls">
                        <button class="nav-btn" id="prevCat">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="#0f0">
                                <path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/>
                            </svg>
                        </button>
                        <div class="selection-value" id="catValue">A</div>
                        <button class="nav-btn" id="nextCat">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="#0f0">
                                <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/>
                            </svg>
                        </button>
                    </div>
                </div>
                
                <div class="selection-group">
                    <div class="selection-label">ROOM</div>
                    <div class="selection-controls">
                        <button class="nav-btn" id="prevRoom">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="#0f0">
                                <path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/>
                            </svg>
                        </button>
                        <div class="selection-value" id="roomValue">001</div>
                        <button class="nav-btn" id="nextRoom">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="#0f0">
                                <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/>
                            </svg>
                        </button>
                    </div>
                </div>
                
                <div class="room-info">
                    <div class="room-id">Room: <span id="roomDisplay">A-001</span></div>
                    <div class="room-hint">15 menit sesi terenkripsi</div>
                </div>
            </div>
            
            <button class="enter-btn" id="enterBtn">
                <span>MASUK KE ROOM</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="#0f0">
                    <path d="M10 17l5-5-5-5v10z"/>
                </svg>
            </button>
        </div>
        
        <!-- Chat Screen -->
        <div class="chat" id="chat">
            <div class="chat-header">
                <div class="room-info">
                    <div class="room-title" id="roomTitle">Room A-001</div>
                    <div class="user-count" id="userCount">1 pengguna online</div>
                </div>
                <div class="header-controls">
                    <div class="timer" id="timer">15:00</div>
                    <button class="back-btn" id="backBtn">KELUAR</button>
                </div>
            </div>
            
            <div class="messages-container" id="messages"></div>
            
            <div class="input-area">
                <input type="text" class="message-input" id="messageInput" placeholder="Ketik pesan... (Enter untuk kirim)">
                <button class="send-btn" id="sendBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="#0f0">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>
    
    <!-- Status Indicator (fixed di pojok) -->
    <div class="status-indicator" id="statusIndicator">
        <div class="status-dot" id="statusDot"></div>
        <span class="status-text" id="statusText">Connecting...</span>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
